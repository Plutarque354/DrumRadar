name = "drumradar"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
ALLOWED_ORIGINS = "http://localhost:8788,http://localhost:63342,http://127.0.0.1:63342"

[[durable_objects.bindings]]
name = "SCANS"
class_name = "ScanCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScanCoordinator"]
