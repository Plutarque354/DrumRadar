name: DrumRadar checks
on:
  push:
    branches: [master, feature/v1-3-sortable-tables]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check public/js/app.js
          node --check public/js/analytics.js
          node --check public/js/table-sort.js
          node --check worker/index.js
      - name: Unit and static tests
        run: npm test
